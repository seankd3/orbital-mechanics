<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#030506" />
  <title>ORBITAL — Apollo 11</title>
</head>
<body>
  <div id="app"></div>

  <div id="ui">
    <header class="top">
      <div class="mission">
        <div class="callsign">APOLLO 11</div>
        <div class="met" id="met">000:00:00</div>
        <div class="chapter" id="chapter"></div>
      </div>
      <div class="capcom">
        <div class="who">CAPCOM</div>
        <p id="capcom"></p>
      </div>
      <div class="status">
        <div class="pill" id="auto">AUTO</div>
        <div class="pill" id="hold">HOLD</div>
        <div><span class="k">WARP</span><b id="warp">1×</b></div>
        <div><span class="k">VIEW</span><b id="view">CHASE</b></div>
      </div>
    </header>

    <section class="card" id="card"></section>

    <footer class="instruments">
      <div class="block" id="orbit"></div>
      <div id="navball"></div>
      <div class="block" id="engine"></div>
    </footer>

    <div id="toasts"></div>
    <div class="hint">H KEYS · ESC MENU</div>
    <div id="help" hidden></div>
    <div id="overlay" hidden></div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
